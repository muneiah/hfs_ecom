{% extends "base.html" %}
{% from "_macros.html" import csrf %}
{% block title %}Log in | {{ store_name }}{% endblock %}
{% block content %}
<div class="narrow page-pad">
  <h1>Log in</h1>
  <form method="post" class="panel">
    {{ csrf() }}
    <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="email" value="{{ email }}"></div>
    <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" required autocomplete="current-password"></div>
    <button class="btn" style="width:100%" type="submit">Log in</button>
  </form>
  <p style="margin-top:1rem">New here? <a href="{{ url_for('register', next=request.args.get('next')) }}">Create an account</a></p>
</div>
{% endblock %}
