{% extends "base.html" %}
{% from "_macros.html" import csrf %}
{% block title %}Change password | {{ store_name }}{% endblock %}
{% block content %}
<div class="narrow page-pad">
  <h1>Change password</h1>
  <form method="post" class="panel">
    {{ csrf() }}
    <div class="field"><label for="current">Current password</label><input id="current" name="current" type="password" required autocomplete="current-password"></div>
    <div class="field"><label for="new">New password</label><input id="new" name="new" type="password" required minlength="8" autocomplete="new-password"><div class="hint">At least 8 characters.</div></div>
    <button class="btn" type="submit">Save password</button>
  </form>
</div>
{% endblock %}
