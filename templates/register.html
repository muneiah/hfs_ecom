{% extends "base.html" %}
{% from "_macros.html" import csrf %}
{% block title %}Create account | {{ store_name }}{% endblock %}
{% block content %}
<div class="narrow page-pad">
  <h1>Create your account</h1>
  <form method="post" class="panel">
    {{ csrf() }}
    <div class="field"><label for="name">Full name</label><input id="name" name="name" required autocomplete="name" value="{{ name }}"></div>
    <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="email" value="{{ email }}"></div>
    <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" required minlength="8" autocomplete="new-password"><div class="hint">At least 8 characters.</div></div>
    <button class="btn" style="width:100%" type="submit">Create account</button>
  </form>
  <p style="margin-top:1rem">Already have an account? <a href="{{ url_for('login', next=request.args.get('next')) }}">Log in</a></p>
</div>
{% endblock %}
